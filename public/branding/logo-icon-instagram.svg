<svg width="1080" height="1080" viewBox="0 0 1080 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg_gradient" x1="0" y1="0" x2="1080" y2="1080" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F5F3F9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="20"/>
      <feOffset dx="0" dy="15"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.15"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="1080" height="1080" fill="url(#bg_gradient)"/>
  
  <g filter="url(#shadow)">
    <!-- Enlarged Music Icon for Icon-only profile pic -->
    <path d="M480 700V250L930 180V650" stroke="#F92445" stroke-width="50" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="380" cy="700" r="120" fill="#F92445"/>
    <circle cx="830" cy="650" r="120" fill="#F92445"/>
    
    <!-- Stylized "TR" inner initials -->
    <text x="540" y="900" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-weight="900" font-size="180" letter-spacing="-5" fill="#381C75">TR</text>
  </g>
</svg>
