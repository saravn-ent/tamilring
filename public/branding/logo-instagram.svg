<svg width="1080" height="1080" viewBox="0 0 1080 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg_gradient" x1="0" y1="0" x2="1080" y2="1080" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F5F3F9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="15"/>
      <feOffset dx="0" dy="10"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.1"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1080" height="1080" fill="url(#bg_gradient)"/>
  
  <!-- Main Logo Group (Centered for Instagram circle crop) -->
  <g filter="url(#shadow)">
    <!-- Music Icon from favicon style but enhanced -->
    <path d="M450 650V250L850 180V580" stroke="#F92445" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="350" cy="650" r="100" fill="#F92445"/>
    <circle cx="750" cy="580" r="100" fill="#F92445"/>
    
    <!-- Text -->
    <text x="540" y="850" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-weight="800" font-size="120" letter-spacing="-2">
      <tspan fill="#F92445">Tamil</tspan><tspan fill="#381C75">Ring</tspan>
    </text>
  </g>
</svg>
